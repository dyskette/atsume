# The Rust port of atsume. It grows beside the Go implementation until it can
# replace it.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/dyskette/atsume"

[workspace.dependencies]
aes = "0.9.3"
base64 = "0.22.1"
cookie = "0.18.2"
cookie_store = "0.22.1"
ctr = "0.10.1"
hmac = "0.13.0"
html5ever = "0.40.1"
# The IRI type xee takes a collation as.
iri-string = "0.7.14"
# The HTML entity table, which must match the one html5ever uses.
markup5ever = "=0.40.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12.0"
tracing = "0.1.44"
ureq = { version = "3.4.2", features = ["brotli"] }
url = "2.5.8"
# Pinned exactly: a 0.1 release may change its API in any update.
xee-xpath = "=0.1.5"
# The arena xee-xpath builds its trees in; it must match xee-xpath's own.
xot = "=0.31.2"

# Thresholds for the size and nesting lints live in clippy.toml.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Readability: shallow, short functions with a one-sentence doc summary.
excessive_nesting = "warn"
cognitive_complexity = "warn"
too_long_first_doc_paragraph = "warn"

# Failure handling: report errors instead of panicking, and leave no
# placeholders or debugging output behind.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Clarity over cleverness.
shadow_unrelated = "warn"
if_then_some_else_none = "warn"
semicolon_if_nothing_returned = "warn"

# xee from a fork whose only change makes the default collation configurable,
# so comparisons ignore case as upstream's do; see docs/MODULES.md. The fork
# sits on the commit that released the versions pinned above, and every xee
# crate comes from it so they share one set of types.
[patch.crates-io]
xee-interpreter = { git = "https://github.com/dyskette/xee", rev = "5d183d6244c4a16a75cb3512bae27c114ea8c2d0" }
xee-ir = { git = "https://github.com/dyskette/xee", rev = "5d183d6244c4a16a75cb3512bae27c114ea8c2d0" }
xee-name = { git = "https://github.com/dyskette/xee", rev = "5d183d6244c4a16a75cb3512bae27c114ea8c2d0" }
xee-schema-type = { git = "https://github.com/dyskette/xee", rev = "5d183d6244c4a16a75cb3512bae27c114ea8c2d0" }
xee-xpath = { git = "https://github.com/dyskette/xee", rev = "5d183d6244c4a16a75cb3512bae27c114ea8c2d0" }
xee-xpath-ast = { git = "https://github.com/dyskette/xee", rev = "5d183d6244c4a16a75cb3512bae27c114ea8c2d0" }
xee-xpath-compiler = { git = "https://github.com/dyskette/xee", rev = "5d183d6244c4a16a75cb3512bae27c114ea8c2d0" }
xee-xpath-lexer = { git = "https://github.com/dyskette/xee", rev = "5d183d6244c4a16a75cb3512bae27c114ea8c2d0" }
xee-xpath-macros = { git = "https://github.com/dyskette/xee", rev = "5d183d6244c4a16a75cb3512bae27c114ea8c2d0" }
xee-xpath-type = { git = "https://github.com/dyskette/xee", rev = "5d183d6244c4a16a75cb3512bae27c114ea8c2d0" }
