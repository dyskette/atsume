# The Rust port of atsume. It grows beside the Go implementation until it can
# replace it.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/dyskette/atsume"

[workspace.dependencies]
cookie = "0.18.2"
cookie_store = "0.22.1"
html5ever = "0.40.1"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12.0"
tracing = "0.1.44"
ureq = { version = "3.4.2", features = ["brotli"] }
url = "2.5.8"
# Pinned exactly: a 0.1 release may change its API in any update.
xee-xpath = "=0.1.5"
# The arena xee-xpath builds its trees in; it must match xee-xpath's own.
xot = "=0.31.2"

# Thresholds for the size and nesting lints live in clippy.toml.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Readability: shallow, short functions with a one-sentence doc summary.
excessive_nesting = "warn"
cognitive_complexity = "warn"
too_long_first_doc_paragraph = "warn"

# Failure handling: report errors instead of panicking, and leave no
# placeholders or debugging output behind.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Clarity over cleverness.
shadow_unrelated = "warn"
if_then_some_else_none = "warn"
semicolon_if_nothing_returned = "warn"
