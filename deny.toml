# Dependency policy, checked by `cargo deny check` in CI.

[advisories]
# Fail on any known vulnerability or unmaintained crate.
yanked = "deny"
# Unmaintained, not vulnerable, and reached only through xee and xot, which
# have no release without them. Revisit when xee updates.
ignore = [
    # json: xee's parse-json() parses with it; json() in modules does not.
    { id = "RUSTSEC-2022-0081", reason = "used by xee-interpreter; no maintained replacement upstream yet" },
    # proc-macro-error: runs at build time only, through xot's genawaiter.
    { id = "RUSTSEC-2024-0370", reason = "build-time proc macro through xot; no upgrade available" },
]

[licenses]
# Licences that may be combined into a GPL-3.0-only work. GPL-2.0-only is
# deliberately absent: it is incompatible, which is why FMD2's modules are
# fetched at run time rather than built in.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list is policy, not inventory: a licence no dependency uses yet is fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The xee fork; see [patch.crates-io] in the root Cargo.toml.
allow-git = ["https://github.com/dyskette/xee"]

# Mozilla's CA root list, bundled for TLS. The licence is a permissive one
# for data, allowed for this crate alone rather than for every dependency.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

