name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The upstream module corpus moves independently of this repository, so the
    # drift check runs on a timer as well as on every change.
    - cron: "17 4 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - run: make check

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      # Clones FMD2 to measure how much of its XPath surface still translates.
      # The checkout is never committed; see docs/MODULES.md.
      - run: make corpus

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads rust-toolchain.toml, so CI lints with the pinned clippy.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: make rust-check

  rust-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      # Clones FMD2 outside the repository: its modules must never be
      # committed. See docs/MODULES.md.
      - run: git clone --depth 1 https://github.com/dazedcat19/FMD2 "$RUNNER_TEMP/fmd2"
      - run: make rust-corpus
        env:
          ATSUME_FMD2_DIR: ${{ runner.temp }}/fmd2

  rust-xidel:
    runs-on: ubuntu-latest
    env:
      # A development build, pinned by checksum: the last release, 0.9.8, is
      # from 2018. See docs/MODULES.md.
      XIDEL_BUILD: 0.9.9.20230617.8842.e14a96920e01
      XIDEL_SHA256: 91615dfa99a8e45e4d84d3c2ed3c453c568d2d7825b1c476f95c48d6ff1a0e02
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install xidel
        run: |
          url="https://sourceforge.net/projects/videlibri/files/Xidel/Xidel%20development/xidel-$XIDEL_BUILD.linux64.tar.gz/download"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xidel.tar.gz" "$url"
          echo "$XIDEL_SHA256  $RUNNER_TEMP/xidel.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/xidel"
          tar -xzf "$RUNNER_TEMP/xidel.tar.gz" -C "$RUNNER_TEMP/xidel" xidel
      - run: make rust-xidel
        env:
          ATSUME_XIDEL: ${{ runner.temp }}/xidel/xidel
