name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The upstream module corpus moves independently of this repository, so the
    # drift check runs on a timer as well as on every change.
    - cron: "17 4 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: make check

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      # Clones FMD2 to measure how much of its XPath surface still translates.
      # The checkout is never committed; see docs/MODULES.md.
      - run: make corpus

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads rust-toolchain.toml, so CI lints with the pinned clippy.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: make rust-check
